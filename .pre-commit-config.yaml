repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
  - repo: local
    hooks:
      - id: folder-structure
        name: folder structure policy
        entry: node scripts/check-folder-structure.mjs
        language: system
        pass_filenames: false
        always_run: true
      - id: actionlint
        name: actionlint (GitHub Actions semantics)
        entry: node scripts/actionlint.mjs
        language: system
        types: [yaml]
        files: ^\.github/workflows/.*\.(yml|yaml)$
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        types: [text]
        # Vitest lifecycle and the FE/graphics acronym.
        args: [--ignore-words-list=afterall]
        exclude: ^(?:package-lock\.json|.*\.(?:glb|vtk))$
