<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>femgx demo</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #eef1f4;
        color: #26313c;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        width: min(1180px, 100vw);
        padding: 28px;
        box-sizing: border-box;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 14px;
      }
      h1 {
        margin: 0;
        font-size: 17px;
        letter-spacing: 0.02em;
        font-weight: 650;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      button {
        border: 1px solid #c8d0d9;
        border-radius: 7px;
        padding: 7px 11px;
        color: #344250;
        background: #ffffff;
        cursor: pointer;
        box-shadow: 0 1px 1px #1f29370d;
      }
      button:hover {
        background: #f2f5f7;
        border-color: #9eabb8;
      }
      #status {
        color: #647384;
        font-size: 13px;
      }
      .viewport {
        overflow: hidden;
        border: 1px solid #cbd3db;
        border-radius: 12px;
        box-shadow:
          0 18px 40px #44515f1f,
          0 2px 5px #44515f12;
      }
      canvas {
        display: block;
        width: 100%;
        height: auto;
        background: #e8edf1;
        touch-action: none;
      }
      .help {
        color: #73808d;
        font-size: 12px;
        margin-top: 10px;
      }
      section + section {
        margin-top: 36px;
      }
      h2 {
        margin: 0;
        font-size: 15px;
        letter-spacing: 0.04em;
        color: #3f4c59;
      }
      label.scale {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #687684;
        font-size: 13px;
      }
      #results-status {
        color: #687684;
        font-size: 13px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>FEMGX · instanced assembly viewer</h1>
        <div class="controls">
          <span id="projection-label" data-testid="projection-label">Perspective</span>
          <button id="projection-toggle" data-testid="projection-toggle" type="button">
            Orthographic
          </button>
          <span id="edge-overlay-label" data-testid="edge-overlay-label">Off</span>
          <button id="edge-overlay" data-testid="edge-overlay" type="button">Overlay edges</button>
          <span id="depth-test-label" data-testid="depth-test-label">On</span>
          <button id="depth-test" data-testid="depth-test" type="button">Depth test off</button>
          <button id="mode-solid" data-mode="solid" data-testid="mode-solid" type="button">
            Solid
          </button>
          <button id="mode-surface" data-mode="surface" data-testid="mode-surface" type="button">
            Surface
          </button>
          <button id="mode-edges" data-mode="edges" data-testid="mode-edges" type="button">
            Edges
          </button>
          <button id="reset" data-testid="reset" type="button">Reset</button>
        </div>
      </header>
      <div class="viewport">
        <canvas id="view" data-testid="view-canvas" width="800" height="600"></canvas>
      </div>
      <div id="status" data-testid="status">8 instances · 8 reusable parts</div>
      <div class="help">
        Left-drag to orbit · Middle-drag or Shift-drag to pan · Scroll to zoom · Click an element or
        instance to select
      </div>
      <section>
        <header>
          <h2>Results · deformation and scalar visualization</h2>
          <div class="controls">
            <button id="results-play-toggle" data-testid="results-play-toggle" type="button">
              Play
            </button>
            <button id="results-case-toggle" data-testid="results-case-toggle" type="button">
              Case: bending
            </button>
            <button
              id="results-deformed-toggle"
              data-testid="results-deformed-toggle"
              type="button"
            >
              Deformed
            </button>
            <button id="results-scalar-toggle" data-testid="results-scalar-toggle" type="button">
              Scalar: off
            </button>
            <label class="scale">
              Deformation scale
              <input
                id="results-scale"
                data-testid="results-scale"
                type="range"
                min="0"
                max="2"
                step="0.05"
                value="1"
              />
            </label>
          </div>
        </header>
        <div class="viewport">
          <canvas
            id="results-canvas"
            data-testid="results-canvas"
            width="800"
            height="600"
          ></canvas>
        </div>
        <div id="results-status" data-testid="results-status"></div>
      </section>
    </main>
    <script type="module" src="/demo/main.ts"></script>
  </body>
</html>
