<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>femgx demo</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, sans-serif;
        background: #0b1020;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        width: min(900px, 100vw);
        padding: 24px;
        box-sizing: border-box;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 12px;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0.04em;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      button {
        border: 1px solid #334155;
        border-radius: 6px;
        padding: 7px 10px;
        color: #e2e8f0;
        background: #172033;
        cursor: pointer;
      }
      button:hover {
        background: #24324c;
      }
      #status {
        color: #94a3b8;
        font-size: 13px;
      }
      .viewport {
        overflow: hidden;
        border: 1px solid #263551;
        border-radius: 10px;
        box-shadow: 0 20px 60px #0008;
      }
      canvas {
        display: block;
        width: 100%;
        height: auto;
        background: radial-gradient(circle at 50% 45%, #182640, #0d1424 70%);
        touch-action: none;
      }
      .help {
        color: #64748b;
        font-size: 12px;
        margin-top: 10px;
      }
      section + section {
        margin-top: 36px;
      }
      h2 {
        margin: 0;
        font-size: 15px;
        letter-spacing: 0.04em;
        color: #cbd5e1;
      }
      label.scale {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #94a3b8;
        font-size: 13px;
      }
      #results-status {
        color: #94a3b8;
        font-size: 13px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>FEMGX · instanced assembly viewer</h1>
        <div class="controls">
          <span id="projection-label" data-testid="projection-label">Perspective</span>
          <button id="projection-toggle" data-testid="projection-toggle" type="button">
            Orthographic
          </button>
          <span id="display-mode-label" data-testid="display-mode-label">Solid</span>
          <button id="display-mode" data-testid="display-mode" type="button">Edges</button>
          <button id="reset" data-testid="reset" type="button">Reset</button>
        </div>
      </header>
      <div class="viewport">
        <canvas id="view" data-testid="view-canvas" width="800" height="600"></canvas>
      </div>
      <div id="status" data-testid="status">21 instances · 3 reusable parts</div>
      <div class="help">
        Drag to orbit · Shift-drag to pan · Scroll to zoom · Click an element or instance to select
      </div>
      <section>
        <header>
          <h2>Results · deformation and scalar visualization</h2>
          <div class="controls">
            <button id="results-case-toggle" data-testid="results-case-toggle" type="button">
              Case: bending
            </button>
            <button
              id="results-deformed-toggle"
              data-testid="results-deformed-toggle"
              type="button"
            >
              Deformed
            </button>
            <button id="results-scalar-toggle" data-testid="results-scalar-toggle" type="button">
              Scalar: off
            </button>
            <label class="scale">
              Deformation scale
              <input
                id="results-scale"
                data-testid="results-scale"
                type="range"
                min="0"
                max="2"
                step="0.05"
                value="1"
              />
            </label>
          </div>
        </header>
        <div class="viewport">
          <canvas
            id="results-canvas"
            data-testid="results-canvas"
            width="800"
            height="600"
          ></canvas>
        </div>
        <div id="results-status" data-testid="results-status"></div>
      </section>
    </main>
    <script type="module" src="/demo/main.ts"></script>
  </body>
</html>
