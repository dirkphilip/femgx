<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>femgx · inspection</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #08111f;
        color: #e7edf5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        overflow: hidden;
      }
      button,
      select,
      input {
        font: inherit;
      }
      button,
      select {
        border: 1px solid #34445c;
        border-radius: 7px;
        padding: 7px 10px;
        color: #dbe7f5;
        background: #172438;
        cursor: pointer;
      }
      button:hover,
      select:hover {
        background: #223550;
      }
      button:focus-visible,
      select:focus-visible {
        outline: 2px solid #60a5fa;
        outline-offset: 2px;
      }
      button[data-active="true"] {
        border-color: #60a5fa;
        color: #fff;
        background: #2563eb;
      }
      .app {
        display: grid;
        grid-template-columns: 288px minmax(0, 1fr);
        height: 100vh;
      }
      .sidebar {
        display: flex;
        min-height: 0;
        flex-direction: column;
        border-right: 1px solid #223149;
        background: #0d1828;
      }
      .brand {
        padding: 18px 18px 14px;
        border-bottom: 1px solid #223149;
      }
      h1 {
        margin: 0;
        font-size: 15px;
        letter-spacing: 0.07em;
        font-weight: 750;
      }
      .subtitle {
        margin: 5px 0 0;
        color: #8ea3bd;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .sidebar-heading {
        margin: 16px 18px 9px;
        color: #91a6c1;
        font-size: 11px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      #visibility-panel {
        overflow: auto;
        padding: 0 14px 18px;
      }
      .visibility-context {
        margin: 0 4px 8px;
        color: #7890ad;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .visibility-branch,
      .visibility-children {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .visibility-children {
        margin-left: 10px;
        padding-left: 8px;
        border-left: 1px solid #263a55;
      }
      .visibility-children[hidden] {
        display: none;
      }
      .visibility-row {
        display: flex;
        align-items: center;
        gap: 5px;
        min-height: 28px;
      }
      .visibility-row label {
        display: flex;
        min-width: 0;
        flex: 1;
        align-items: center;
        gap: 6px;
        color: #d5dfeb;
        cursor: pointer;
        font-size: 13px;
      }
      .visibility-row input {
        accent-color: #3b82f6;
      }
      .visibility-expander,
      .visibility-spacer {
        flex: 0 0 22px;
        width: 22px;
        height: 22px;
        padding: 0;
        border: 0;
        color: #9db1c8;
        background: transparent;
      }
      .visibility-expander:hover {
        background: #1c2d45;
      }
      .visibility-kind {
        color: #738aa6;
        font-size: 9px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .visibility-assembly .visibility-kind {
        color: #61b5ff;
      }
      .visibility-label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .visibility-body-branch {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .visibility-body {
        min-height: 25px;
      }
      .visibility-body .visibility-body-spacer {
        flex-basis: 42px;
        width: 42px;
      }
      .visibility-body label {
        color: #b4c4d6;
        font-size: 12px;
      }
      .visibility-body-actions {
        display: inline-flex;
        flex: 0 0 auto;
        gap: 3px;
      }
      .visibility-body-action {
        padding: 3px 5px;
        border-color: #2b3c54;
        color: #91a6be;
        background: #122033;
        font-size: 9px;
        line-height: 1;
      }
      .visibility-body-action[data-active="true"] {
        border-color: #e29a3c;
        color: #fff0d2;
        background: #70451b;
      }
      .visibility-body-group-action {
        flex: 0 0 auto;
        padding: 3px 5px;
        border-color: #2b3c54;
        color: #91a6be;
        background: #122033;
        font-size: 9px;
        line-height: 1;
      }
      .visibility-body-group-action[data-active="true"] {
        border-color: #e29a3c;
        color: #fff0d2;
        background: #70451b;
      }
      .scene {
        position: relative;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        background: #e8edf1;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #e8edf1;
        touch-action: none;
      }
      #axis-gizmo {
        position: absolute;
        z-index: 4;
        left: 14px;
        bottom: 14px;
        width: 86px;
        height: 86px;
        border: 1px solid #2c405a;
        border-radius: 9px;
        background: #0b1728df;
        box-shadow: 0 10px 30px #06101ea8;
        pointer-events: none;
      }
      #axis-gizmo svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      #axis-gizmo line {
        stroke-linecap: round;
        stroke-width: 3;
      }
      #axis-gizmo circle {
        fill: #e7edf5;
      }
      #axis-gizmo text {
        font-size: 12px;
        font-weight: 750;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .toolbar {
        position: absolute;
        z-index: 5;
        top: 14px;
        left: 14px;
        right: 14px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        pointer-events: none;
      }
      .toolbar > * {
        pointer-events: auto;
      }
      .control-group {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px;
        border: 1px solid #34445c;
        border-radius: 9px;
        background: #111d2ddd;
        backdrop-filter: blur(8px);
      }
      .control-label {
        padding: 0 3px 0 5px;
        color: #a7b8cc;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .toggle-label {
        padding: 3px 7px;
        border: 1px solid #334860;
        border-radius: 999px;
        color: #a8bbd0;
        background: #18263a;
        font-size: 10px;
        font-weight: 700;
      }
      .toggle-label[data-state="on"] {
        border-color: #2188da;
        color: #cbeeff;
        background: #0b4c75;
      }
      .hud {
        position: absolute;
        z-index: 4;
        right: 14px;
        border: 1px solid #2c405a;
        border-radius: 9px;
        background: #0b1728df;
        box-shadow: 0 10px 30px #06101ea8;
        backdrop-filter: blur(8px);
      }
      #performance-overlay {
        position: absolute;
        z-index: 4;
        right: 14px;
        top: 88px;
        min-width: 160px;
        border: 1px solid #2c405a;
        border-radius: 9px;
        padding: 10px 12px;
        color: #e5edf8;
        background: #0b1728df;
        box-shadow: 0 10px 30px #06101ea8;
        backdrop-filter: blur(8px);
        font-size: 12px;
        line-height: 1.55;
        white-space: pre-line;
      }
      .inspection {
        bottom: 14px;
        width: min(330px, calc(100% - 28px));
        padding: 10px 12px;
      }
      .inspection h2 {
        margin: 0 0 6px;
        color: #93a9c3;
        font-size: 10px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      .inspection pre,
      #stats-panel {
        margin: 0;
        color: #d5e0ee;
        font:
          12px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        white-space: pre-wrap;
      }
      #status {
        position: absolute;
        z-index: 4;
        bottom: 15px;
        left: 112px;
        max-width: calc(100% - 380px);
        color: #d8e1eb;
        font-size: 12px;
        text-shadow: 0 1px 2px #09111c;
      }
      .context-menu {
        position: fixed;
        z-index: 50;
        min-width: 220px;
        max-width: calc(100vw - 16px);
        max-height: calc(100vh - 16px);
        overflow-y: auto;
        border: 1px solid #475d79;
        border-radius: 8px;
        padding: 6px;
        background: #101d2e;
        box-shadow: 0 16px 48px #000c;
      }
      .context-menu button {
        display: block;
        width: 100%;
        border: 0;
        background: transparent;
        text-align: left;
        box-shadow: none;
      }
      .context-menu button:hover {
        background: #263a56;
      }
      .context-menu .menu-section {
        margin: 4px 0;
        border-top: 1px solid #263a55;
        padding-top: 4px;
      }
      .context-menu .menu-title {
        padding: 4px 10px 2px;
        color: #93a9c3;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      #stats-panel {
        display: none;
      }
      @media (max-width: 720px) {
        body {
          overflow: auto;
        }
        .app {
          grid-template-columns: 1fr;
          grid-template-rows: minmax(480px, 72vh) auto;
          height: auto;
          min-height: 100vh;
        }
        .scene {
          grid-row: 1;
          min-height: 480px;
        }
        .sidebar {
          grid-row: 2;
          border-top: 1px solid #223149;
          border-right: 0;
        }
        .brand {
          padding: 13px 16px;
        }
        #visibility-panel {
          max-height: 300px;
        }
        .toolbar {
          top: 8px;
          left: 8px;
          right: 8px;
        }
        select,
        button {
          min-height: 44px;
        }
        #model-select {
          max-width: calc(100% - 16px);
        }
        .visibility-body-action {
          min-height: 30px;
        }
        .visibility-body-group-action {
          min-height: 30px;
        }
        .toolbar .control-group:nth-of-type(n + 3),
        #results-control,
        #depth-test-label,
        #depth-test,
        #node-overlay-label,
        #node-overlay {
          display: none;
        }
        #performance-overlay {
          display: none;
        }
        .inspection {
          display: none;
        }
        #status {
          bottom: 9px;
          left: 108px;
          max-width: calc(100% - 117px);
          font-size: 11px;
        }
        #axis-gizmo {
          left: 9px;
          bottom: 9px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <aside class="sidebar">
        <div class="brand">
          <h1>FEMGX</h1>
          <p class="subtitle">FE inspection</p>
        </div>
        <h2 class="sidebar-heading">Visibility</h2>
        <div id="visibility-panel" data-testid="visibility-panel"></div>
      </aside>
      <section class="scene" aria-label="Model scene">
        <canvas id="view" data-testid="view-canvas" width="800" height="600"></canvas>
        <div id="axis-gizmo" data-testid="axis-gizmo" aria-label="World coordinate axes">
          <svg viewBox="0 0 100 100" role="img" aria-label="Positive and negative X, Y and Z axes">
            <circle cx="50" cy="50" r="3"></circle>
            <line
              data-axis-line="x-positive"
              x1="50"
              y1="50"
              x2="81"
              y2="50"
              stroke="#ef6b6b"
            ></line>
            <line
              data-axis-line="x-negative"
              x1="50"
              y1="50"
              x2="19"
              y2="50"
              stroke="#ef6b6b"
            ></line>
            <line
              data-axis-line="y-positive"
              x1="50"
              y1="50"
              x2="50"
              y2="19"
              stroke="#67c587"
            ></line>
            <line
              data-axis-line="y-negative"
              x1="50"
              y1="50"
              x2="50"
              y2="81"
              stroke="#67c587"
            ></line>
            <line
              data-axis-line="z-positive"
              x1="50"
              y1="50"
              x2="50"
              y2="81"
              stroke="#6fa8ed"
            ></line>
            <line
              data-axis-line="z-negative"
              x1="50"
              y1="50"
              x2="50"
              y2="19"
              stroke="#6fa8ed"
            ></line>
            <text data-axis-label="x-positive" x="89" y="50" fill="#ef6b6b">+X</text>
            <text data-axis-label="x-negative" x="11" y="50" fill="#ef6b6b">−X</text>
            <text data-axis-label="y-positive" x="50" y="11" fill="#67c587">+Y</text>
            <text data-axis-label="y-negative" x="50" y="89" fill="#67c587">−Y</text>
            <text data-axis-label="z-positive" x="50" y="89" fill="#6fa8ed">+Z</text>
            <text data-axis-label="z-negative" x="50" y="11" fill="#6fa8ed">−Z</text>
          </svg>
        </div>
        <div class="toolbar">
          <span id="renderer-status" data-testid="renderer-status" class="toggle-label"></span>
          <select id="model-select" data-testid="model-select" aria-label="Model"></select>
          <button id="fit-view" data-testid="fit-view" type="button">Fit</button>
          <div class="control-group">
            <span id="projection-label" data-testid="projection-label" class="control-label"
              >Perspective</span
            ><button id="projection-toggle" data-testid="projection-toggle" type="button">
              Orthographic
            </button>
          </div>
          <div class="control-group">
            <span
              id="edge-overlay-label"
              data-testid="edge-overlay-label"
              class="toggle-label"
              data-state="off"
              >Off</span
            ><button
              id="edge-overlay"
              data-testid="edge-overlay"
              type="button"
              aria-pressed="false"
            >
              Overlay edges
            </button>
          </div>
          <div class="control-group" id="results-control">
            <span
              id="results-label"
              data-testid="results-label"
              class="toggle-label"
              data-state="base"
              >base</span
            ><button id="results-toggle" data-testid="results-toggle" type="button" disabled>
              No results
            </button>
          </div>
          <div class="control-group">
            <span
              id="depth-test-label"
              data-testid="depth-test-label"
              class="toggle-label"
              data-state="on"
              >On</span
            ><button id="depth-test" data-testid="depth-test" type="button" aria-pressed="true">
              Depth test off
            </button>
          </div>
          <div class="control-group">
            <span
              id="node-overlay-label"
              data-testid="node-overlay-label"
              class="toggle-label"
              data-state="off"
              >Off</span
            ><button
              id="node-overlay"
              data-testid="node-overlay"
              type="button"
              aria-pressed="false"
            >
              Show nodes
            </button>
          </div>
          <button id="reset" data-testid="reset" type="button">Reset</button>
        </div>
        <div id="performance-overlay" data-testid="performance-overlay">
          Idle · render on change
        </div>
        <div class="hud inspection">
          <h2>Inspection</h2>
          <pre id="inspection-panel" data-testid="inspection-panel"></pre>
        </div>
        <div id="status" data-testid="status"></div>
        <pre id="stats-panel" data-testid="stats-panel"></pre>
      </section>
      <div id="context-menu" class="context-menu" data-testid="context-menu" hidden></div>
    </main>
    <script type="module" src="/demo/main.ts"></script>
  </body>
</html>
