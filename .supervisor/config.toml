# Shared Agent Supervisor workflow. Commit this file so the team shares roles
# and checks; keep run state in run/ (already ignored).
# Per-user settings belong in config.local.toml (see config.local.example.toml).

[repository]
# Path to the Git checkout relative to this config directory (or absolute).
path = ".."
# Branch that workers rebase onto and that PRs target.
base_branch = "main"
# Shared fallback branch prefix. Override per user in config.local.toml.
branch_prefix = "supervisor-"

[runner]
# Local queue file (ignored). Relative paths resolve from this config directory.
issues_file = "issues.json"
# Runtime state, worktrees, locks, and supervisor.log (ignored).
state_dir = "run"
# Prompt templates for agent stages (committed under prompts/).
templates_dir = "prompts"
# Default wall-clock timeout for a single agent or supervisor stage.
default_timeout_seconds = 7200
# Fallback for agent roles without an explicit stall policy (including custom agents).
agent_stall_timeout_seconds = 1800
# Meaningful-progress stall defaults: implementation gets 30 minutes; interactive
# review and PR repair get 10 minutes. Repeated heartbeats and log output do not
# reset these timers.
implement_stall_timeout_seconds = 1800
review_stall_timeout_seconds = 600
repair_stall_timeout_seconds = 600
# Give agents five minutes to start before stall detection can intervene.
agent_startup_grace_seconds = 300
# Caps concurrent agent-capable jobs for `sv run` (and auto-pull).
# A job holds a slot from queue through merge — including open PRs that may
# still launch a repair pass — not only active implement/review workers.
# Override this in config.local.toml when your machine has different capacity.
max_issues_per_run = 3

[logging]
# Levels: debug, info, warning, error, critical.
# Run logs are written to .supervisor/run/supervisor.log.
level = "INFO"

[agent]
# Shared fallback provider: "cursor", "copilot", "codex", "opencode", "fake", or "custom".
# Override per user in config.local.toml (for example, provider = "cursor").
provider = "opencode"
# Optional shared default model; users may override it locally.
# model = "..."
# Codex only: set the model's reasoning effort, for example "xhigh".
# codex_reasoning_effort = "xhigh"
# OpenCode models use the provider/model form, for example "openai/gpt-5.2".
# Required when provider = "custom". Must include a "{prompt}" argument.
# command = ["my-agent", "--prompt", "{prompt}"]

[github]
enabled = true
# When true, created pull requests are drafts.
draft = true
# Automatically queue open GitHub issues that have no assignee when running.
# Safer default: queue issues manually, or set allow_labels below for approval.
# Only issues carrying an approval label below are auto-pulled; this is the
# allow-list gate. The label must be added by the repo owner (or a trusted
# agent), never by random contributors.
auto_pull = true
# Automatically launch a one-shot PR repair pass when sync detects conflicts,
# failing checks, or new review activity. Explicit `sv job repair` still works
# when false. Uses prompts/pr-repair.md (bundled; not a [[stages]] entry).
repair = true
# username is user-specific and belongs in config.local.toml.
# Label suffixes are combined with github.supervisor_label_prefix at runtime.
in_progress_label = "in-progress"
# Issues with any of these labels are skipped by task pulls. An individual
# `sv run ISSUE --force` can override this. Use a full label such as
# "team:skip" to ignore labels outside the supervisor prefix.
ignore_labels = ["ignore"]
# When non-empty, auto-pull only selects issues with at least one of these
# labels. Ignore labels still take precedence. Use a full label such as
# "team:ready" for labels outside the supervisor prefix. This is the
# approval allow-list: only issues labeled by the owner or trusted agents get
# pulled in automatically.
allow_labels = ["ready-for-supervisor"]
# Status labels are prefixed so it is clear they are managed by Agent Supervisor.
supervisor_label_prefix = "sup:"
# Add a per-user suffix, such as "-laptop", to distinguish local instances.
# Override in config.local.toml when multiple supervisors share a repo.
# supervisor_label_suffix = "-your-machine"
# Supervisors sharing one repository must use distinct label namespaces, or
# start the extra run explicitly with `sv run --allow-multiple`.
# How long wait_for_ci (and related PR check waits) may block.
ci_timeout_seconds = 3600

# Stages are an ordered checklist through draft PR creation. Agent stages write
# handoff.json with status "success" to advance; supervisor stages perform side
# effects (comment, submit_pr, wait_for_ci, wait_for_labels). A stage may set
# when_labels = ["label"] to skip itself when none of those labels are present,
# or deny_labels = ["label"] to skip itself when any of those labels are present.
# wait_for_labels also requires allow_labels and deny_labels; denial wins over
# approval, while an unavailable GitHub read keeps the job waiting. Post-PR repair is not a stage: it
# is gated by github.repair and uses prompts/pr-repair.md.
#
# Agent stage fields:
#   name, kind = "agent", template (prompt under templates_dir)
#   timeout_seconds (optional; defaults to runner.default_timeout_seconds)
#   refresh_base = true (optional; rebase onto base before launch)
# Supervisor stage kinds: "submit_pr", "wait_for_ci", "comment", "wait_for_labels"
#   comment requires target = "issue" or "pr"
#   wait_for_labels requires allow_labels = [...] and deny_labels = [...]

[[stages]]
name = "implement"
kind = "agent"
template = "implementer.md"

[[stages]]
name = "review"
kind = "agent"
template = "reviewer.md"
refresh_base = true
deny_labels = ["no_review"]

[[stages]]
name = "submit"
kind = "submit_pr"

[[stages]]
name = "publish_review"
kind = "comment"
target = "pr"
deny_labels = ["no_review"]

# Optional examples (uncomment to extend the workflow):
# [[stages]]
# name = "publish_plan"
# kind = "comment"
# target = "issue"
# when_labels = ["needs-plan"]
#
# [[stages]]
# name = "plan_approval"
# kind = "wait_for_labels"
# when_labels = ["needs-plan"]
# allow_labels = ["plan-accepted"]
# deny_labels = ["plan-rejected"]
#
# [[stages]]
# name = "ci"
# kind = "wait_for_ci"
