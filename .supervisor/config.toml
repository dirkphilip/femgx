# Shared Agent Supervisor workflow. Commit this file so the team shares roles
# and checks; keep run state in run/ (already ignored).
# Per-user settings belong in config.local.toml (see config.local.example.toml).

[repository]
# Path to the Git checkout relative to this config directory (or absolute).
path = ".."
# Branch that workers rebase onto and that PRs target.
base_branch = "main"
# Shared fallback branch prefix. Override per user in config.local.toml.
branch_prefix = "supervisor-"

[runner]
# Local queue file (ignored). Relative paths resolve from this config directory.
issues_file = "issues.json"
# Runtime state, worktrees, locks, and supervisor.log (ignored).
state_dir = "run"
# Prompt templates for agent stages (committed under prompts/).
templates_dir = "prompts"
# Default wall-clock timeout for a single agent or supervisor stage.
default_timeout_seconds = 7200
# Fallback meaningful-progress stall policy for agent stages without an explicit
# policy (including custom agents).
agent_stall_timeout_seconds = 1800
# Fallback startup grace before stall detection can intervene for such stages.
agent_startup_grace_seconds = 300
# Caps concurrent agent-capable jobs for `sv run` (and auto-pull).
# A job holds a slot from queue through merge — including open PRs that may
# still launch a repair pass — not only active implement/review workers.
# Override this in config.local.toml only when tasks are known to be independent.
# Two slots limit rebase conflicts and local resource contention while keeping
# the workflow parallel for unrelated issues.
max_issues_per_run = 2

[logging]
# Levels: debug, info, warning, error, critical.
# Run logs are written to .supervisor/run/supervisor.log.
level = "INFO"

[agent]
# Shared fallback provider: "cursor", "copilot", "codex", "opencode", "fake", or "custom".
# Override per user in config.local.toml (for example, provider = "cursor").
provider = "opencode"
# Optional shared default model; users may override it locally.
# model = "..."
# Codex only: set the model's reasoning effort, for example "xhigh".
# codex_reasoning_effort = "xhigh"
# OpenCode models use the provider/model form, for example "openai/gpt-5.2".
# Required when provider = "custom". Must include a "{prompt}" argument.
# command = ["my-agent", "--prompt", "{prompt}"]

[github]
enabled = true
# Keep created pull requests ready for review instead of opening them as drafts.
draft = false
# Ask GitHub to merge submitted PRs automatically after required checks and
# approvals are satisfied.
auto_merge = true
# Automatically queue open GitHub issues that have no assignee when running.
# Safer default: queue issues manually, or set allow_labels below for approval.
# Only issues carrying an approval label below are auto-pulled; this is the
# allow-list gate. The label must be added by the repo owner (or a trusted
# agent), never by random contributors.
auto_pull = true
# Keep repair passes explicit. Automatic repair can repeatedly relaunch agents
# while a PR is waiting on CI or human review; `sv job repair ISSUE` remains
# available for a deliberate one-shot repair.
repair = false
# Built-in PR repair is not a workflow stage, so its agent watchdog policy is
# declared here next to the repair toggle: a 10-minute meaningful-progress stall
# budget and a five-minute startup grace before stall detection can intervene.
repair_stall_timeout_seconds = 600
repair_startup_grace_seconds = 300
# username is user-specific and belongs in config.local.toml.
# Issues with any of these labels are skipped by task pulls. An individual
# `sv run ISSUE --force` can override this. Labels are matched exactly as
# written here: a bare name such as "ignore" matches the GitHub label "ignore",
# and a fully qualified name such as "team:skip" matches that exact GitHub
# label. Ignore labels take precedence over allow labels.
ignore_labels = ["ignore"]
# When non-empty, auto-pull only selects issues carrying at least one of these
# labels. Labels are matched exactly as written here (no supervisor namespace
# prefix is applied): "ready-for-supervisor" matches the GitHub label
# "ready-for-supervisor", and a fully qualified name such as "team:ready"
# matches that exact label. Ignore labels still take precedence. This is the
# approval allow-list: only issues labeled by the owner or trusted agents get
# pulled in automatically. Do not add the "sv:" prefix here; that would
# silently change the matched label.
allow_labels = ["ready-for-supervisor"]
# Status labels use the current Agent Supervisor namespace.
supervisor_label_prefix = "sv:"
# Add a per-user suffix, such as "-laptop", to distinguish local instances.
# Override in config.local.toml when multiple supervisors share a repo.
# supervisor_label_suffix = "-your-machine"
# Supervisors sharing one repository must use distinct label namespaces, or
# start the extra run explicitly with `sv run --allow-multiple`.
# How long wait_for_ci (and related PR check waits) may block.
ci_timeout_seconds = 3600

# Stages are an ordered checklist through pull request creation. Agent stages write
# handoff.json with status "success" to advance; supervisor stages perform side
# effects (comment, submit_pr, wait_for_ci, wait_for_labels). Stage conditions
# are explicit:
#   when = { stage = "review", field = "status", equals = "success" } gates a
#     stage on one field of a prior agent stage's handoff (workflow state).
#     `field` is one of status, summary, tests_run, blocker; use either
#     `equals = "..."` or `present = true/false`, not both. When the source
#     stage has not produced a handoff, the condition is not met and the stage
#     is skipped.
#   when_labels = ["label"] skips a stage when none of those GitHub labels are
#     present, and deny_labels = ["label"] skips it when any is present. These
#     stay GitHub label gates; prefer `when` for decisions about prior stage
#     handoffs.
#   wait_for_labels uses allow_labels and deny_labels as its human approval
#     decision; denial wins over approval, while an unavailable GitHub read
#     keeps the job waiting. Post-PR repair is not a stage: it is gated by
#     github.repair (with its own watchdog policy above) and uses
#     prompts/pr-repair.md.
#
# Migration: a comment stage such as publish_review that used
# `deny_labels = ["no_review"]` as a proxy for "review happened" should now
# declare `when = { stage = "review", field = "status", equals = "success" }`.
#
# Agent stage fields:
#   name, kind = "agent", template (prompt under templates_dir)
#   timeout_seconds (optional; defaults to runner.default_timeout_seconds)
#   refresh_base = true (optional; rebase onto base before launch)
# Supervisor stage kinds: "submit_pr", "wait_for_ci", "comment", "wait_for_labels"
#   comment requires target = "issue" or "pr"
#   wait_for_labels requires allow_labels = [...] and deny_labels = [...]

[[stages]]
name = "implement"
kind = "agent"
template = "implementer.md"
# Implementation gets 30 minutes of meaningful-progress stall budget.
stall_timeout_seconds = 1800
# Give agents five minutes to start before stall detection can intervene.
startup_grace_seconds = 300

[[stages]]
name = "review"
kind = "agent"
template = "reviewer.md"
refresh_base = true
deny_labels = ["no_review"]
# Interactive review gets 10 minutes of meaningful-progress stall budget.
stall_timeout_seconds = 600
startup_grace_seconds = 300

[[stages]]
name = "submit"
kind = "submit_pr"

[[stages]]
name = "publish_review"
kind = "comment"
target = "pr"
when = { stage = "review", field = "status", equals = "success" }

# Optional examples (uncomment to extend the workflow):
# [[stages]]
# name = "publish_plan"
# kind = "comment"
# target = "issue"
# when_labels = ["needs-plan"]
#
# [[stages]]
# name = "plan_approval"
# kind = "wait_for_labels"
# when_labels = ["needs-plan"]
# allow_labels = ["plan-accepted"]
# deny_labels = ["plan-rejected"]
#
