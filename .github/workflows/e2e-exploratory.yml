name: Exploratory e2e

# Standard hosted runners do not provide authoritative hardware-WebGPU
# evidence, but a manual full-suite run cheaply shows which browser paths still
# execute there. Keep failures visible and use real system-Chrome hardware runs
# for rendering conclusions; this lane is intentionally not a required check.
on:
  workflow_dispatch:
  # Temporary one-run trigger; removed after the hosted-runner experiment.
  push:
    branches: [codex/744-hardware-webgpu-failures]

permissions:
  contents: read

concurrency:
  group: exploratory-e2e
  cancel-in-progress: false

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report Chrome version
        run: google-chrome --version

      - name: Run full e2e suite through software WebGPU
        run: npx playwright test --project=chrome-software --reporter=list,html

      - name: Upload Playwright results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: exploratory-e2e-results
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
