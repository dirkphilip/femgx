name: Exploratory software WebGPU

# Hosted runners are not authoritative hardware-WebGPU environments. This
# manual lane answers a narrower question: can bounded render-and-pick journeys
# execute through Chrome's explicit SwiftShader adapter, and how long do they
# take? The required hardware evidence remains the local system-Chrome lane.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exploratory-software-webgpu
  cancel-in-progress: true

jobs:
  software-interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report Chrome version
        run: google-chrome --version

      - name: Run software-WebGPU interaction suite
        run: time npx playwright test --project=chrome-software --project=chrome-software-interaction --reporter=list,html

      - name: Upload Playwright results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: exploratory-software-interaction-results
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

  software-rendering:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: "1/2"
            name: shard-1
          - shard: "2/2"
            name: shard-2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report Chrome version
        run: google-chrome --version

      - name: Run software-WebGPU rendering suite
        run: time npx playwright test --project=chrome-software-rendering --shard=${{ matrix.shard }} --reporter=list,html

      - name: Upload Playwright results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: exploratory-software-rendering-${{ matrix.name }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
