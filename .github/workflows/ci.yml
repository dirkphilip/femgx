name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # These three jobs are parallel work shards. The final `check` job below is
  # the stable branch-protection context.
  check-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore ESLint cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .cache/eslint
          key: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.js') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.js') }}-

      - name: Pre-commit hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: API documentation
        run: npm run build:docs

  check-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Demo workbench coverage
        run: npm run test:demo:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage
          # Coverage is useful for PR review while it is current; keep the
          # longer-lived copy on main for historical investigation.
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 14 }}

  check-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Performance budgets
        run: npm run bench:budget

      - name: Package smoke tests
        run: npm run test:package

  # Keep this job id stable: it is the required branch-protection context.
  check:
    if: ${{ always() }}
    needs: [check-static, check-runtime, check-package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a check shard did not succeed
        if: ${{ needs.check-static.result != 'success' || needs.check-runtime.result != 'success' || needs.check-package.result != 'success' }}
        run: |
          echo "check-static: ${{ needs.check-static.result }}"
          echo "check-runtime: ${{ needs.check-runtime.result }}"
          echo "check-package: ${{ needs.check-package.result }}"
          exit 1

      - name: Confirm check shards passed
        run: echo "check-static, check-runtime, and check-package passed"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify system Chrome
        run: |
          command -v google-chrome
          google-chrome --version

      # Full WebGPU pick/pixel e2e needs hardware Chrome (`npm run test:e2e`
      # locally). CI uses the runner's branded Chrome only for the no-GPU
      # unsupported contract until a GPU runner exists; SwiftShader is not
      # treated as a faithful WebGPU stand-in.
      - name: Run e2e (no-GPU contract)
        run: npm run test:e2e:no-gpu

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
