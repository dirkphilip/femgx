name: Performance

# Opt-in performance reports. Not part of the default CI gate: CPU budgets are
# enforced by `npm run bench:budget` in ci.yml, while this workflow emits the
# same calibrated medians for human review and trend tracking. Real-WebGPU
# capacity measurements remain a local system-Chrome workflow until a hardware
# runner is explicitly owned.
on:
  workflow_dispatch:

jobs:
  budget-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run budget report
        run: PERF_REPORT=1 npm run bench:budget
