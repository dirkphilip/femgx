name: Performance

# Opt-in performance runs. Not part of the default CI gate: CPU budgets are
# enforced by `npm run bench:budget` in ci.yml, while this workflow runs the
# CPU benchmark suite for human review and trend tracking. Real-WebGPU capacity
# measurements remain a local system-Chrome workflow until a hardware runner is
# explicitly owned. Run the CPU workflow manually via workflow_dispatch.
on:
  workflow_dispatch:

jobs:
  cpu-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run benchmark suite
        run: npm run bench
