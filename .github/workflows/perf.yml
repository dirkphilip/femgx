name: Performance

# Opt-in performance runs. Not part of the default CI gate: CPU budgets are
# enforced by `npm run bench:budget` in ci.yml, while this workflow runs the
# full benchmark suite and the real-WebGPU capacity benchmark for human review and
# trend tracking. Run it manually via workflow_dispatch.
on:
  workflow_dispatch:

jobs:
  cpu-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run benchmark suite
        run: npm run bench

  browser-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_PERF: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install system Chrome
        run: npx playwright install --with-deps chrome

      - name: Run WebGPU benchmark
        run: xvfb-run --auto-servernum npm run bench:webgpu

      - name: Upload WebGPU benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webgpu-benchmark
          path: test-results/**/webgpu-benchmark.json
          if-no-files-found: warn
