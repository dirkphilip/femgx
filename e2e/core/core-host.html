<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FemGx core browser host</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-width: 640px;
        background: #151a21;
        color: #e8edf2;
      }
      main {
        display: grid;
        gap: 12px;
        padding: 16px;
      }
      #core-canvas {
        display: block;
        width: 640px;
        height: 480px;
        background: #252d38;
      }
      #core-stage {
        position: relative;
        width: 640px;
      }
      body[data-case="hardware-conformance"] {
        min-width: 0;
      }
      body[data-case^="depth-"] {
        min-width: 0;
      }
      body[data-case="hardware-conformance"] #core-stage {
        width: min(960px, calc(100vw - 32px));
      }
      body[data-case^="depth-"] #core-stage {
        width: min(960px, calc(100vw - 32px));
      }
      body[data-case="hardware-conformance"] #core-canvas {
        width: 100%;
        height: min(640px, calc(100vh - 80px));
      }
      body[data-case^="depth-"] #core-canvas {
        width: 100%;
        height: min(640px, calc(100vh - 80px));
      }
    </style>
  </head>
  <body>
    <main>
      <output id="core-status" data-result="loading">Core host loading</output>
      <div id="core-stage"><canvas id="core-canvas" width="640" height="480"></canvas></div>
    </main>
    <script type="module" src="./core-host.ts"></script>
  </body>
</html>
