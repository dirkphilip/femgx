<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FemGx host integration</title>
    <style>
      body {
        margin: 0;
        font:
          14px system-ui,
          sans-serif;
        color: #e8eef8;
        background: #101722;
      }
      main {
        display: grid;
        grid-template-rows: minmax(360px, 1fr) auto;
        min-height: 100vh;
      }
      canvas {
        width: 100%;
        height: 100%;
        min-height: 360px;
      }
      section {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        padding: 12px 16px;
      }
      output {
        display: block;
        min-height: 1.5em;
        white-space: pre-wrap;
      }
      @media (max-width: 600px) {
        section {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="viewport"></canvas>
      <section>
        <div><strong>Validation</strong><output id="diagnostics"></output></div>
        <div><strong>Picked result</strong><output id="inspection">Click a panel</output></div>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
